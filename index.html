<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <!-- Stealth Navigation for Portfolio -->
        <nav class="top-nav">
            <a href="https://lavishkamboj.github.io/portfolio/" target="_blank" class="portfolio-stealth-link" aria-label="View Portfolio">
                <!-- Faint User Profile Icon -->
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </a>
        </nav>

        <div class="header-content">
            <h1>The Blogs</h1>
            <p class="subtitle">Thoughts, stories and ideas.</p>
            <div class="controls">
                <div class="search-wrapper">
                    <input type="text" id="searchInput" placeholder="Search articles...">
                </div>
                <select id="categoryFilter">
                    <option value="all">All Topics</option>
                    <option value="Tech">Tech</option>
                    <option value="Universe">Universe</option>
                    <option value="Universe">Consciousness</option>
                 
                </select>
            </div>
        </div>
    </header>

    <main id="blogContainer" class="blog-grid"></main>

    <article id="fullPostView" class="hidden">
        <div class="post-header-image"></div>
        <div class="post-container">
            <button id="backBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Back to Articles
            </button>
            <div id="fullPostContent"></div>
        </div>
    </article>

    <script src="script.js"></script>
</body>
</html>
